<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Awareness • Rail Drishti</title><style>body{margin:0;font-family:Arial;background:linear-gradient(#f5efe5,#e9dfcf);color:#292522}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.nav{background:#071c2c;padding:18px}.nav a{color:#fff;text-decoration:none;margin-right:18px;font-size:13px}.card{background:#fffdf7eF;border:1px solid #d5c8b6;border-radius:15px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.big{font-size:28px;font-weight:800;margin-top:8px}.label{font-size:11px;text-transform:uppercase;color:#756b60;letter-spacing:1px}.btn{background:#6f1d1b;color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:bold;cursor:pointer}select{padding:12px;width:100%;border:1px solid #d5c8b6;border-radius:8px;font-size:15px}.notice{padding:14px;background:#eee3d1;border-left:4px solid #6f1d1b;border-radius:6px;margin-top:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><a href="/">Rail Drishti</a><a href="/features">Features</a><a href="/gps">GPS</a><a href="/reports">Reports</a><a href="/review">Reviews</a></div><main class="wrap"><h1>🌦️ Weather Awareness</h1><p>Check route weather and the project's delay-risk logic.</p><div class="card"><label>Train</label><select id="train"><option>12301</option><option>12002</option><option>12951</option><option>12424</option></select><button class="btn" onclick="load()">Check weather</button></div><div id="out"></div></main><script>async function load(){const d=await (await fetch('/api/weather/'+document.getElementById('train').value)).json();document.getElementById('out').innerHTML=`<div class="grid"><div class="card"><div class="label">Condition</div><div class="big">${d.condition}</div></div><div class="card"><div class="label">Risk</div><div class="big">${d.risk}</div></div><div class="card"><div class="label">Potential delay</div><div class="big">+${d.delay_risk_min} min</div></div></div><div class="card"><b>${d.message}</b><div class="notice">${d.alert ? '⚠️ Weather alert: this train may experience weather-related delay.' : '✅ No weather alert for the selected route.'}</div></div>`}load();setInterval(load,15000)</script></body></html>

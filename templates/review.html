<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey Review • Rail Drishti</title><style>body{margin:0;font-family:Arial;background:linear-gradient(#f5efe5,#e9dfcf);color:#292522}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.nav{background:#071c2c;padding:18px}.nav a{color:#fff;text-decoration:none;margin-right:18px;font-size:13px}.card{background:#fffdf7eF;border:1px solid #d5c8b6;border-radius:15px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stars button{border:1px solid #d5c8b6;background:white;padding:8px;border-radius:6px;margin:3px;cursor:pointer}.stars button.selected{background:#6f1d1b;color:#fff}select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:7px 0 13px;border:1px solid #d5c8b6;border-radius:8px;font:inherit}.btn{background:#6f1d1b;color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:bold;cursor:pointer}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #ddd}.notice{padding:12px;background:#eee3d1;margin-top:12px;border-left:4px solid #6f1d1b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><a href="/">Rail Drishti</a><a href="/features">Features</a><a href="/weather">Weather</a><a href="/gps">GPS</a><a href="/reports">Reports</a></div><main class="wrap"><h1>⭐ Journey Review</h1><div class="grid"><div class="card"><label>Train</label><select id="train"><option>12301</option><option>12002</option><option>12951</option><option>12424</option></select><div id="fields"></div><label>Overall rating</label><div id="overall" class="stars"></div><label>Comments</label><textarea id="comment" rows="5" placeholder="How was your journey?"></textarea><button class="btn" onclick="submitReview()">Submit review</button><div id="msg"></div></div><div class="card"><h2>Passenger rating summary</h2><div id="summary"></div></div></div></main><script>const dims=['Punctuality','Cleanliness','Comfort','Safety','Food','Staff'];function starbox(id){const b=document.getElementById(id);b.innerHTML='';for(let i=1;i<=5;i++){const x=document.createElement('button');x.textContent='★ '+i;x.onclick=()=>{b.dataset.value=i;[...b.children].forEach(y=>y.classList.toggle('selected',Number(y.textContent.split(' ')[1])<=i))};b.appendChild(x)}}fields.innerHTML=dims.map((x,i)=>`<label>${x}</label><div id="r${i}" class="stars"></div>`).join('');dims.forEach((_,i)=>starbox('r'+i));starbox('overall');async function load(){const d=await (await fetch('/api/reviews/summary?train='+train.value)).json();summary.innerHTML=`<div class="row"><span>Reviews</span><b>${d.reviews}</b></div><div class="row"><span>Overall</span><b>${d.overall||'—'} / 5</b></div><div class="row"><span>Cleanliness</span><b>${d.cleanliness||'—'} / 5</b></div><div class="row"><span>Comfort</span><b>${d.comfort||'—'} / 5</b></div><div class="row"><span>Safety</span><b>${d.safety||'—'} / 5</b></div>`}async function submitReview(){const g=id=>Number(document.getElementById(id).dataset.value||0);const vals=dims.map((_,i)=>g('r'+i)),overall=g('overall');if(!overall||vals.some(v=>!v)){msg.innerHTML='<div class="notice">Please rate every category.</div>';return}const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({train:train.value,rating:overall,punctuality:vals[0],cleanliness:vals[1],comfort:vals[2],safety:vals[3],food:vals[4],staff:vals[5],comment:comment.value})});const d=await r.json();msg.innerHTML='<div class="notice">'+(d.message||d.error)+'</div>';if(r.ok)load()}train.onchange=load;load()</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger Reports • Rail Drishti</title><style>body{margin:0;font-family:Arial;background:linear-gradient(#f5efe5,#e9dfcf);color:#292522}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.nav{background:#071c2c;padding:18px}.nav a{color:#fff;text-decoration:none;margin-right:18px;font-size:13px}.card{background:#fffdf7eF;border:1px solid #d5c8b6;border-radius:15px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:7px 0 13px;border:1px solid #d5c8b6;border-radius:8px;font:inherit}.btn{background:#6f1d1b;color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:bold;cursor:pointer}.report{padding:12px 0;border-bottom:1px solid #ddd}.small{font-size:12px;color:#756b60}.notice{padding:12px;background:#eee3d1;margin-top:12px;border-left:4px solid #6f1d1b}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><a href="/">Rail Drishti</a><a href="/features">Features</a><a href="/weather">Weather</a><a href="/gps">GPS</a><a href="/review">Reviews</a></div><main class="wrap"><h1>👥 Passenger Live Reporting</h1><div class="grid"><div class="card"><label>Train</label><select id="train"><option>12301</option><option>12002</option><option>12951</option><option>12424</option></select><label>Coach</label><input id="coach" placeholder="B3"><label>Problem</label><select id="category"><option>Cleanliness</option><option>AC / Fan</option><option>Washroom</option><option>Seat / Coach</option><option>Food / Catering</option><option>Water</option><option>Safety / Security</option><option>Other</option></select><label>Description</label><textarea id="description" rows="5" placeholder="Describe the issue..."></textarea><button class="btn" onclick="submitReport()">Submit report</button><div id="msg"></div></div><div class="card"><h2>Recent reports</h2><div id="reports"></div></div></div></main><script>async function load(){const d=await (await fetch('/api/reports?train='+document.getElementById('train').value)).json();document.getElementById('reports').innerHTML=d.length?d.map(r=>`<div class="report"><b>${r.category}</b> · Coach ${r.coach}<div>${r.description}</div><div class="small">${r.location} · ${r.created_at}</div></div>`).join(''):'<p class="small">No reports yet.</p>'}async function submitReport(){const body={train:train.value,coach:coach.value,category:category.value,description:description.value,location:'Current train location'};const r=await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();msg.innerHTML='<div class="notice">'+(d.message||d.error)+'</div>';if(r.ok){description.value='';load()}}train.onchange=load;load();setInterval(load,10000)</script></body></html>
